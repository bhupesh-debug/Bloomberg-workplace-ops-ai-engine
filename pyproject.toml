[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bloomberg-workplace-ops-ai-engine"
version = "1.0.0"
description = "Enterprise FP&A, Real Estate Optimization, and Anomaly Detection Platform for Bloomberg Workplace Operations"
authors = [{ name = "Bhupesh Chandra Dimri", email = "bhupeshcdimri21@gmail.com" }]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "streamlit>=1.30.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
